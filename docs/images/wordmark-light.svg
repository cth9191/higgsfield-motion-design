<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="224" viewBox="0 0 1120 224" role="img" aria-labelledby="title desc">
<title id="title">King-design</title>
<desc id="desc">King-design wordmark — royal crown with motion trails, Space Grotesk.</desc>
<style>
.trail-one{animation:drift 4s ease-in-out infinite}
.trail-two{animation:drift 4s .18s ease-in-out infinite}
@keyframes drift{0%,65%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}}
@media(prefers-reduced-motion:reduce){.trail-one,.trail-two{animation:none}}
.word{font-family:"Space Grotesk", system-ui, -apple-system, sans-serif; font-weight:800; letter-spacing:-0.04em}
</style>
<!-- Crown trails -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path class="trail-one" d="M26 151L54 71L85 127L116 71L144 151" stroke="#E8C86A" stroke-width="10" opacity=".18"/>
  <path class="trail-two" d="M42 151L70 71L101 127L132 71L160 151" stroke="#E8C86A" stroke-width="10" opacity=".42"/>
  <!-- Crown main -->
  <path d="M58 151L86 71L117 127L148 71L176 151" stroke="#C9A86A" stroke-width="14"/>
  <!-- Crown jewels -->
  <circle cx="86" cy="71" r="6" fill="#C9A86A" stroke="none"/>
  <circle cx="148" cy="71" r="6" fill="#C9A86A" stroke="none"/>
  <circle cx="117" cy="127" r="4.5" fill="#7C3AED" opacity="0.9"/>
</g>
<!-- Text -->
<text x="222" y="155" class="word" font-size="112" fill="#19243B">King<tspan fill="#7C3AED">-</tspan><tspan fill="#19243B" font-weight="600">design</tspan></text>
<text x="222" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.18em" fill="#6B7A90">UNIVERSAL • ANY AGENT • MOTION</text>
</svg>
