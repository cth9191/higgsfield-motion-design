interface:
  display_name: "Motion Design"
  short_description: "Browse motion presets and create your own video — Pi"
  default_prompt: "Use motion-design to show me motion-graphics styles with playable examples, then help me adapt one for my project."
install:
  hint: "Copy skills/motion-design to ~/.pi/agent/skills/motion-design or .pi/skills/motion-design. Connect Higgsfield MCP via pi mcp add higgsfield --transport http --url https://mcp.higgsfield.ai/mcp"
mcp:
  server: higgsfield
  transport: http
  url: https://mcp.higgsfield.ai/mcp
