interface:
  display_name: "Motion Design"
  short_description: "Browse motion presets and create your own video — Gemini CLI"
  default_prompt: "Use motion-design to show me motion-graphics styles with playable examples, then help me adapt one for my project."
install:
  hint: "Copy skills/motion-design to your Gemini CLI skills/extensions folder. For MCP, use a MCP-compatible host or run Higgsfield via https://mcp.higgsfield.ai/mcp. Without MCP, use prompt export to Higgsfield web."
mcp:
  server: higgsfield
  transport: http
  url: https://mcp.higgsfield.ai/mcp
